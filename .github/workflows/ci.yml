name: CI

# Everything that needs no browser: install from the lockfile, the unit suite
# (which includes the no-Babylon bundle check on the engine-free entries), the
# typecheck, formatting, and the site + library build.
#
# Action pins: by SHA, Node 24 releases, from
# tosijs-coding-practices/templates/publish.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to the Bun the project is built with locally. Bundler output
      # differs between Bun versions, so CI must not float.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Unit suite
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Formatting
        run: bun run format:check

      - name: Build (site + library)
        run: bun run build
