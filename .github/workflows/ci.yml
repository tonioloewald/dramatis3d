name: CI

# Three jobs, all on every PR and (through pages.yml, which calls this file and
# deploys only if it passes) on every push to main:
#
#   test     no network beyond the install, no browser: the unit suite (which
#            includes the no-Babylon bundle check on the engine-free entries),
#            gate 1, typecheck, formatting, the site + library build, and the
#            packed-tarball smoke test (bin/pack-smoke.ts: what an adopter installs,
#            imported under node and bun with three present and Babylon absent).
#   network  DRAMATIS_NETWORK=1: the tests that rebuild characters from the human
#            pack on cdn.tosijs.net (buildCharacter, the VRM export, the seams).
#   browser  DRAMATIS_BROWSER=1 DRAMATIS_NETWORK=1: the viewer e2e in Playwright's
#            headless Chromium (WebGL on SwiftShader), including the creator ->
#            View in three.js -> viewer path.
#
# The network and browser jobs fail if any test of their tier reports NOT RUN, so a
# tier that silently skips can't pass. The engines tier (DRAMATIS_ENGINES: Godot,
# Blender, Unity) stays manual: it needs installed engines; see reports/spike-1.md.
#
# Action pins: by SHA, Node 24 releases, from
# tosijs-coding-practices/templates/publish.yml.

on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pinned to the Bun the project is built with locally. Bundler output
      # differs between Bun versions, so CI must not float.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # The smoke test runs the tarball under node too.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          package-manager-cache: false

      - run: bun install --frozen-lockfile

      - name: Unit suite
        run: bun test

      - name: Gate 1 (samples/out)
        run: bun run gate1

      - name: Typecheck
        run: bun run typecheck

      - name: Formatting
        run: bun run format:check

      - name: Build (site + library)
        run: bun run build

      - name: Packed-tarball smoke test
        run: bun bin/pack-smoke.ts

  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Network tier (DRAMATIS_NETWORK=1)
        shell: bash
        env:
          DRAMATIS_NETWORK: '1'
        run: |
          bun test --reporter=junit --reporter-outfile="$RUNNER_TEMP/network.xml"
          if grep -o 'NOT RUN (set DRAMATIS_NETWORK=1)[^"]*' "$RUNNER_TEMP/network.xml"; then
            echo "::error::network-tier tests reported NOT RUN with DRAMATIS_NETWORK=1"
            exit 1
          fi

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      # The Chromium matching the locked playwright-core, plus its system libraries.
      - name: Install Playwright Chromium
        run: bun x playwright-core install --with-deps chromium

      # The e2e builds the site itself (bun bin/site.ts --build) before it starts.
      - name: Viewer e2e (DRAMATIS_BROWSER=1 DRAMATIS_NETWORK=1)
        shell: bash
        env:
          DRAMATIS_BROWSER: '1'
          DRAMATIS_NETWORK: '1'
        run: |
          bun test site/viewer --reporter=junit --reporter-outfile="$RUNNER_TEMP/browser.xml"
          if grep -q '<skipped' "$RUNNER_TEMP/browser.xml"; then
            echo "::error::viewer e2e tests were skipped with DRAMATIS_BROWSER=1 DRAMATIS_NETWORK=1"
            exit 1
          fi

      - name: Keep the e2e screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: .cache/e2e
          if-no-files-found: ignore
