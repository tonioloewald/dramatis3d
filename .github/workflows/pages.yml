name: Pages

# Build the site (bun run build → www/) and deploy it to GitHub Pages at
# dramatis.tosijs.net (site/CNAME; the build writes www/CNAME from it).
#
# This repo builds the site in Actions rather than committing it to /docs as
# tosijs-3d does: www/ is gitignored. Pages must be set to "GitHub Actions" as
# its source (Settings → Pages) for this to deploy.
#
# It deploys only what CI passed: the `ci` job runs .github/workflows/ci.yml
# (unit suite, gate 1, build, tarball smoke, the network tier and the browser e2e)
# on this same commit, and the build job needs it. A red CI means no deploy, from a
# push or from a manual run alike. (reviews/0.1.0-dx.md: Pages used to deploy
# whatever main built, with the env-gated tiers never run anywhere.)
#
# Action pins: by SHA, Node 24 releases. checkout and setup-bun are the pins in
# tosijs-coding-practices/templates/publish.yml; the three Pages actions are
# not in that template and are pinned here to their Node 24 releases.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Build the site
        run: bun run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
